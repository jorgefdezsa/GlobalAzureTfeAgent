# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

infra:
    provider: microsoft.foundry
name: global-azure-tfe
services:
    asistente-vuelos:
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        docker:
            remoteBuild: true
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            # URL pública del servidor MCP (o del AI Gateway): azd env set MCP_URL https://.../mcp
            MCP_URL: ${MCP_URL}
            MCP_SUBSCRIPTION_KEY: ${MCP_SUBSCRIPTION_KEY}
            # Cabecera de la clave (x-mcp-key con el gateway): azd env set MCP_KEY_HEADER x-mcp-key
            MCP_KEY_HEADER: ${MCP_KEY_HEADER}
        host: azure.ai.agent
        kind: hosted
        # Guardrail + control de egress (deploy/setup-guardrails.sh crea la policy y guarda su ID ARM completo).
        # azd no expande variables aquí: el ID va literal (lo imprime setup-guardrails.sh; cámbialo si cambia la suscripción).
        policies:
            - type: rai_policy
              raiPolicyName: /subscriptions/6b514360-d1db-4639-8f79-ea84de62691f/resourceGroups/GlobalAzureTenerife/providers/Microsoft.CognitiveServices/accounts/globalazureagent/raiPolicies/demo1-guardrail
        language: docker
        name: asistente-vuelos
        project: src/GlobalDemo.AgentHosted
        protocols:
            - protocol: responses
              version: 2.0.0
        startupCommand: dotnet GlobalDemo.AgentHosted.dll
        uses:
            - proj-globaltfe
    proj-globaltfe:
        endpoint: https://globalazureagent.services.ai.azure.com/api/projects/proj-globaltfe
        host: azure.ai.project
