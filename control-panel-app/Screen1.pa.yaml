                              - btnChEnviar:
                                  Control: ModernButton
                                  Properties:
                                    Text: =If(varOcupado, "Enviando…", "Enviar")
                                    AccessibleLabel: ="Enviar el mensaje al agente"
                                    Appearance: =ButtonAppearance.Outline
                                    Layout: =ButtonLayout.TextOnly
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12.6
                                    Color: =colCian
                                    BorderColor: =colCian
