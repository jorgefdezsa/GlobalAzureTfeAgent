                                    Width: =120
                                    Height: =44
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Center
                                    LayoutMinWidth: =120
                                    LayoutMinHeight: =44
                                    OnSelect: |-
                                      =Set(varTexto, If(Not(IsBlank(varEnvio)), varEnvio, Trim(txtChMensaje.Text)));
                                      Set(varEnvio, "");
                                      If(
                                        Not(varOcupado) && Not(IsBlank(varTexto)),
                                        Set(varOcupado, true);
                                        Set(varIdMsg, Coalesce(Max(colMensajes, id), 0) + 1);
                                        Collect(colMensajes, {id: varIdMsg, rol: "user", texto: varTexto, entrada: 0, cacheado: 0, salida: 0, coste: 0, chips: "", uso: ""});
                                        Collect(colMensajes, {id: varIdMsg + 1, rol: "assistant", texto: "", entrada: 0, cacheado: 0, salida: 0, coste: 0, chips: "", uso: ""});
                                        Reset(txtChMensaje);
                                        Set(varNuevaTraza, Coalesce(Max(colTrazas, id), 0) + 1);
                                        Collect(colTrazas, {id: varNuevaTraza, titulo: "Chat · " & Left(varTexto, 40), hora: Text(Now(), "hh:mm:ss"), ms: 0});
                                        Collect(colPasos, {trazaId: varNuevaTraza, orden: 1, etiqueta: "Panel → Agente (Foundry)", detalle: "POST /responses", estado: "pending"});
                                        Set(varTrazaIdx, 0);
                                        Set(varChatError, "");
                                        IfError(
                                          Set(varChatResp, GlobalDemoControl.ChatSync(varTexto, {previousResponseId: varPreviousId})),
                                          Set(varChatError, FirstError.Message)
                                        );
                                        If(varChatError = "" && Not(IsBlank(varChatResp.error)), Set(varChatError, varChatResp.error));
                                        If(
                                          varChatError <> "",
                                          Patch(colMensajes, LookUp(colMensajes, id = varIdMsg + 1), {texto: If("content_filter" in varChatError, "🛡 Bloqueado por el guardrail de Foundry: la petición infringe la política de seguridad de contenido y no ha llegado al modelo.", "⚠ " & varChatError)});
                                          ForAll(Filter(colPasos, trazaId = varNuevaTraza && estado = "pending") As p, Patch(colPasos, p, {estado: If("content_filter" in varChatError, "blocked", "error")})),
                                          Patch(colPasos, LookUp(colPasos, trazaId = varNuevaTraza && orden = 1), {estado: "ok"});
                                          ForAll(
                                            varChatResp.toolCalls As c,
                                            Collect(colPasos, {trazaId: varNuevaTraza, orden: CountRows(Filter(colPasos, trazaId = varNuevaTraza)) + 1, etiqueta: If(c.name = "consultar_url", "Agente → Internet (egress del agente)", "Agente → AI Gateway"), detalle: "tools/call " & c.name & " " & c.arguments & Char(10) & c.detail, estado: c.state})
                                          );
                                          Collect(colPasos, {trazaId: varNuevaTraza, orden: CountRows(Filter(colPasos, trazaId = varNuevaTraza)) + 1, etiqueta: "Agente → Panel", detalle: "respuesta del modelo", estado: "ok"});
                                          Set(varCoste, If(varGw.priceInput + varGw.priceOutput > 0, ((varChatResp.usage.input - varChatResp.usage.cached) * varGw.priceInput + varChatResp.usage.cached * varGw.priceCached + varChatResp.usage.output * varGw.priceOutput) / 1000000, 0));
                                          Patch(
                                            colMensajes,
                                            LookUp(colMensajes, id = varIdMsg + 1),
                                            {
                                              texto: varChatResp.text,
                                              entrada: varChatResp.usage.input,
                                              cacheado: varChatResp.usage.cached,
                                              salida: varChatResp.usage.output,
                                              coste: varCoste,
                                              chips: Concat(varChatResp.toolCalls, Switch(state, "ok", "✓ ", "blocked", "⛔ ", "egress", "🚫 ", "limited", "⏱ ", "error", "⚠ ", "") & name & Switch(state, "blocked", " · bloqueada", "egress", " · egress denegado", "limited", " · límite", ""), "   "),
                                              uso: varChatResp.usage.input & " in" & If(varChatResp.usage.cached > 0, " (" & varChatResp.usage.cached & " en caché)", "") & " · " & varChatResp.usage.output & " out" & If(varCoste > 0, " · ≈ " & Text(varCoste, If(varCoste < 0.01, "0.0000", "0.00")) & " $", "")
                                            }
                                          );
                                          Set(varPreviousId, varChatResp.responseId);
                                          Patch(colTrazas, LookUp(colTrazas, id = varNuevaTraza), {ms: varChatResp.ms})
                                        );
                                        Set(varOcupado, false);
                                        IfError(ClearCollect(colRequests, GlobalDemoControl.GetRequests()), Blank())
                                      )
