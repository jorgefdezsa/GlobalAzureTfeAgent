Screens:
  Screen1:
    Properties:
      LoadingSpinnerColor: =colCian
      Fill: =colFondo
    Children:
      - conRaiz:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutJustifyContent: =LayoutJustifyContent.Start
            LayoutGap: =0
            PaddingTop: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            DropShadow: =DropShadow.None
          Children:
            - conCabecera:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Height: =96
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =16
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  DropShadow: =DropShadow.None
                Children:
                  - conTitulo:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutGap: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        DropShadow: =DropShadow.None
                      Children:
                        - lblTitulo:
                            Control: Label
                            Properties:
                              Text: ="Control Panel v2.0 · asistente-vuelos"
                              Role: =TextRole.Heading1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Size: =17.1
                              Color: =colCian
                              Wrap: =false
                              Height: =29
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                        - lblSubtitulo:
                            Control: Label
                            Properties:
                              Text: ="Foundry Hosted Agent · .NET 10 · Agent Framework | tools por MCP | gobernado desde Foundry (AI Gateway)"
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Normal
                              Size: =12.6
                              Color: =colApagado
                              Wrap: =true
                              Height: =44
                              VerticalAlign: =VerticalAlign.Top
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                  - conCabDerecha:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Width: =704
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutGap: =8
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        DropShadow: =DropShadow.None
                      Children:
                        - conPildoras:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Height: =44
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutGap: =12
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              DropShadow: =DropShadow.None
                            Children:
                              - conPildoraGuardrail:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Visible: =Not(IsBlank(varGuardrail))
                                    Width: =180
                                    Height: =44
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Center
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =0
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    Fill: =colPanel2
                                    BorderColor: =If(varGuardrail.found && varGuardrail.jailbreakBlocking, colVerde, colRojo)
                                    BorderThickness: =1
                                    RadiusTopLeft: =22
                                    RadiusTopRight: =22
                                    RadiusBottomLeft: =22
                                    RadiusBottomRight: =22
                                    DropShadow: =DropShadow.None
                                  Children:
                                    - lblGuardrail:
                                        Control: Label
                                        Properties:
                                          Text: =If(varGuardrail.found && varGuardrail.jailbreakBlocking, "🛡 Guardrail activo", "⚠ Sin guardrail")
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Size: =12.6
                                          Color: =If(varGuardrail.found && varGuardrail.jailbreakBlocking, colVerde, colRojo)
                                          Align: =Align.Center
                                          Wrap: =false
                                          FillPortions: =1
                                          AlignInContainer: =AlignInContainer.Stretch
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                              - conPildoraEgress:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Visible: =Not(IsBlank(varGuardrail)) && varGuardrail.found && Not(IsBlank(varGuardrail.egressMode))
                                    Width: =250
                                    Height: =44
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Center
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =0
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    Fill: =colPanel2
                                    BorderColor: =If(varGuardrail.egressMode = "Enforced", colVerde, colAmbar)
                                    BorderThickness: =1
                                    RadiusTopLeft: =22
                                    RadiusTopRight: =22
                                    RadiusBottomLeft: =22
                                    RadiusBottomRight: =22
                                    DropShadow: =DropShadow.None
                                  Children:
                                    - lblEgress:
                                        Control: Label
                                        Properties:
                                          Text: =If(varGuardrail.egressMode = "Enforced", "Egress · solo el AI Gateway", "Egress · en auditoría")
                                          Tooltip: =Concat(varGuardrail.allowedHosts, Value, ", ")
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Size: =12.6
                                          Color: =If(varGuardrail.egressMode = "Enforced", colVerde, colAmbar)
                                          Align: =Align.Center
                                          Wrap: =false
                                          FillPortions: =1
                                          AlignInContainer: =AlignInContainer.Stretch
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                              - conPildoraAgente:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Width: =170
                                    Height: =44
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Center
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =8
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =14
                                    PaddingRight: =12
                                    Fill: =colPanel2
                                    BorderColor: =If(Not(IsBlank(varGw)) && IsBlank(varGwError) && varGw.agentConfigured, colVerde, colRojo)
                                    BorderThickness: =1
                                    RadiusTopLeft: =22
                                    RadiusTopRight: =22
                                    RadiusBottomLeft: =22
                                    RadiusBottomRight: =22
                                    DropShadow: =DropShadow.None
                                  Children:
                                    - conPuntoAgente:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          Width: =12
                                          Height: =12
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Center
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          Fill: =If(Not(IsBlank(varGw)) && IsBlank(varGwError) && varGw.agentConfigured, colVerde, colRojo)
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          DropShadow: =DropShadow.None
                                    - lblAgente:
                                        Control: Label
                                        Properties:
                                          Text: =If(Not(IsBlank(varGw)) && IsBlank(varGwError) && varGw.agentConfigured, "Agente activo", "Sin conexión")
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Size: =12.6
                                          Color: =If(Not(IsBlank(varGw)) && IsBlank(varGwError) && varGw.agentConfigured, colVerde, colRojo)
                                          Wrap: =false
                                          FillPortions: =1
                                          AlignInContainer: =AlignInContainer.Stretch
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                        - conControles:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Height: =44
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutJustifyContent: =LayoutJustifyContent.End
                              LayoutGap: =12
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              DropShadow: =DropShadow.None
                            Children:
                              - conModo:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Width: =360
                                    Height: =44
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Center
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =0
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    DropShadow: =DropShadow.None
                                  Children:
                                    - btnModoGateway:
                                        Control: Classic/Button
                                        Properties:
                                          Text: ="Vía AI Gateway"
                                          Tooltip: =If(varModo = "gateway", "Modo activo", "")
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Size: =12.6
                                          Fill: =If(varModo = "gateway", colCian, colPanel2)
                                          Color: =If(varModo = "gateway", colFondo, colTexto)
                                          HoverFill: =If(varModo = "gateway", colCian, colLinea)
                                          HoverColor: =Self.Color
                                          PressedFill: =If(varModo = "gateway", colCian, colLinea)
                                          PressedColor: =Self.Color
                                          BorderColor: =colLinea
                                          HoverBorderColor: =colLinea
                                          PressedBorderColor: =colLinea
                                          FocusedBorderColor: =colTexto
                                          BorderThickness: =1
                                          RadiusTopLeft: =8
                                          RadiusBottomLeft: =8
                                          RadiusTopRight: =0
                                          RadiusBottomRight: =0
                                          AutoDisableOnSelect: =false
                                          Width: =180
                                          Height: =44
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =44
                                          OnSelect: =Set(varModo, "gateway")
                                    - btnModoDirecto:
                                        Control: Classic/Button
                                        Properties:
                                          Text: ="Directo al backend"
                                          Tooltip: =If(varModo = "direct", "Modo activo", "")
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Size: =12.6
                                          Fill: =If(varModo = "direct", colCian, colPanel2)
                                          Color: =If(varModo = "direct", colFondo, colTexto)
                                          HoverFill: =If(varModo = "direct", colCian, colLinea)
                                          HoverColor: =Self.Color
                                          PressedFill: =If(varModo = "direct", colCian, colLinea)
                                          PressedColor: =Self.Color
                                          BorderColor: =colLinea
                                          HoverBorderColor: =colLinea
                                          PressedBorderColor: =colLinea
                                          FocusedBorderColor: =colTexto
                                          BorderThickness: =1
                                          RadiusTopLeft: =0
                                          RadiusBottomLeft: =0
                                          RadiusTopRight: =8
                                          RadiusBottomRight: =8
                                          AutoDisableOnSelect: =false
                                          Width: =180
                                          Height: =44
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Stretch
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =44
                                          OnSelect: =Set(varModo, "direct")
                              - lblSesion:
                                  Control: Label
                                  Properties:
                                    Text: =If(IsBlank(varPreviousId), "Sesión nueva", "Sesión " & Right(varPreviousId, 6))
                                    Font: =Font.'Courier New'
                                    FontWeight: =FontWeight.Normal
                                    Size: =12.6
                                    Color: =colApagado
                                    Align: =Align.Center
                                    Wrap: =false
                                    Width: =130
                                    Height: =44
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Center
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =44
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                              - btnNuevaConversacion:
                                  Control: Classic/Button
                                  Properties:
                                    Text: ="Nueva conversación"
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =12.6
                                    Fill: =colPanel2
                                    Color: =colTexto
                                    HoverFill: =colLinea
                                    HoverColor: =colTexto
                                    PressedFill: =colLinea
                                    PressedColor: =colTexto
                                    BorderColor: =colLinea
                                    HoverBorderColor: =colLinea
                                    PressedBorderColor: =colLinea
                                    FocusedBorderColor: =colTexto
                                    BorderThickness: =1
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    AutoDisableOnSelect: =false
                                    Width: =190
                                    Height: =44
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Center
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =44
                                    OnSelect: |-
                                      =Clear(colMensajes);
                                      Set(varPreviousId, "");
                                      Set(varOcupado, false)
            - conCuerpo:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutJustifyContent: =LayoutJustifyContent.Start
                  LayoutGap: =16
                  PaddingTop: =16
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  DropShadow: =DropShadow.None
                Children:
                  - conChat:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =48
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutJustifyContent: =LayoutJustifyContent.Start
                        LayoutGap: =8
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =18
                        PaddingRight: =18
                        Fill: =colPanel
                        BorderColor: =colLinea
                        BorderThickness: =1
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        DropShadow: =DropShadow.None
                      Children:
                        - lblChTitulo:
                            Control: Label
                            Properties:
                              Text: ="Conversación con el agente (v2)"
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Size: =14.4
                              Color: =colTexto
                              Wrap: =false
                              Height: =28
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =0
                              LayoutMinHeight: =28
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                        - lblChResumen:
                            Control: Label
                            Properties:
                              Visible: =Sum(colMensajes, entrada) + Sum(colMensajes, salida) > 0
                              Text: |-
                                ="Conversación: " & Text(Sum(colMensajes, entrada), "#,##0") & " tokens in · " & Text(Sum(colMensajes, salida), "#,##0") & " out" & If(Sum(colMensajes, coste) > 0, " · ≈ " & Text(Sum(colMensajes, coste), If(Sum(colMensajes, coste) < 0.01, "0.0000", "0.00")) & " $", "")
                              Font: =Font.'Segoe UI'
                              Size: =12.6
                              Color: =colApagado
                              Wrap: =false
                              Height: =24
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =0
                              LayoutMinHeight: =24
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                        - galChMensajes:
                            Control: Gallery
                            Variant: VariableHeight
                            Properties:
                              Items: =Filter(colMensajes, rol = "user")
                              AccessibleLabel: ="Mensajes de la conversación"
                              TemplatePadding: =2
                              ShowScrollbar: =true
                              Fill: =colPanel
                              BorderThickness: =0
                              Height: =320
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =0
                              LayoutMinHeight: =240
                              TabIndex: =0
                            Children:
                              - conChMsg:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Width: =Parent.TemplateWidth
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutJustifyContent: =LayoutJustifyContent.Start
                                    LayoutGap: =8
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    PaddingTop: =2
                                    PaddingBottom: =24
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    DropShadow: =DropShadow.None
                                  Children:
                                    - lblChTexto:
                                        Control: Label
                                        Properties:
                                          Text: =ThisItem.texto
                                          Font: =Font.'Segoe UI'
                                          Size: =12.6
                                          Color: =colTexto
                                          Fill: =ColorValue("#123a78")
                                          BorderColor: =colLinea
                                          BorderThickness: =1
                                          Align: =Align.Right
                                          Wrap: =true
                                          AutoHeight: =true
                                          Width: =Parent.Width * 0.86
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.End
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          PaddingTop: =8
                                          PaddingBottom: =8
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                    - htmChTexto:
                                        Control: HtmlViewer
                                        Properties:
                                          HtmlText: |-
                                            =With(
                                              {t: Substitute(Substitute(Substitute(If(LookUp(colMensajes, id = ThisItem.id + 1).texto = "", "Pensando…", LookUp(colMensajes, id = ThisItem.id + 1).texto), "&", "&amp;"), "<", "&lt;"), ">", "&gt;")},
                                              Substitute(
                                                Concat(
                                                  Sequence(CountRows(Split(t, "**"))),
                                                  With(
                                                    {s: Index(Split(t, "**"), Value).Value},
                                                    If(Mod(Value, 2) = 0, "<b>" & s & "</b>", s)
                                                  )
                                                ),
                                                Char(10),
                                                "<br>"
                                              )
                                            )
                                          Font: =Font.'Segoe UI'
                                          Size: =12.6
                                          Color: =colTexto
                                          Fill: =colPanel2
                                          BorderColor: =colLinea
                                          BorderThickness: =1
                                          AutoHeight: =false
                                          Width: =Parent.Width * 0.86
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Start
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          Height: |-
                                            =With(
                                              {t: Substitute(If(LookUp(colMensajes, id = ThisItem.id + 1).texto = "", "Pensando…", LookUp(colMensajes, id = ThisItem.id + 1).texto), "**", ""), cpl: Max(8, RoundDown((Parent.Width * 0.86 - 26) / 6, 0))},
                                              Max(32, Sum(Split(t, Char(10)), RoundUp(Max(1, Len(Value)) / cpl, 0)) * 19 + 18)
                                            )
                                          PaddingTop: =8
                                          PaddingBottom: =8
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                    - lblChUso:
                                        Control: Label
                                        Properties:
                                          Visible: =LookUp(colMensajes, id = ThisItem.id + 1).chips <> "" || LookUp(colMensajes, id = ThisItem.id + 1).uso <> ""
                                          Text: |-
                                            =With({r: LookUp(colMensajes, id = ThisItem.id + 1)}, Trim(r.chips & If(r.chips <> "" && r.uso <> "", Char(10), "") & r.uso))
                                          Font: =Font.'Courier New'
                                          Size: =12.6
                                          Color: =colApagado
                                          Wrap: =true
                                          AutoHeight: =true
                                          Width: =Parent.Width * 0.86
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Start
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =24
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =4
                                          PaddingRight: =4
                        - galChSugerencias:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              Items: =fxSugerencias
                              AccessibleLabel: ="Preguntas sugeridas"
                              TemplateSize: =48
                              TemplatePadding: =4
                              WrapCount: =1
                              ShowScrollbar: =true
                              Fill: =colPanel
                              BorderThickness: =0
                              Height: =104
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =0
                              LayoutMinHeight: =104
                              TabIndex: =0
                            Children:
                              - btnChSugerencia:
                                  Control: Classic/Button
                                  Properties:
                                    Text: =ThisItem.etiqueta
                                    Tooltip: =ThisItem.prompt
                                    Font: =Font.'Segoe UI'
                                    Size: =12.6
                                    Fill: =colPanel2
                                    Color: =colTexto
                                    HoverFill: =colLinea
                                    HoverColor: =colTexto
                                    PressedFill: =colLinea
                                    PressedColor: =colTexto
                                    BorderColor: =If(ThisItem.guardrail, colMorado, colLinea)
                                    HoverBorderColor: =If(ThisItem.guardrail, colMorado, colLinea)
                                    PressedBorderColor: =If(ThisItem.guardrail, colMorado, colLinea)
                                    FocusedBorderColor: =colTexto
                                    BorderThickness: =1
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    AutoDisableOnSelect: =false
                                    Align: =Align.Left
                                    DisplayMode: =If(varOcupado, DisplayMode.Disabled, DisplayMode.Edit)
                                    Width: =Parent.TemplateWidth
                                    Height: =Parent.TemplateHeight
                                    OnSelect: |-
                                      =Set(varEnvio, ThisItem.prompt);
                                      Select(btnChEnviar)
                        - conChEntrada:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =0
                              LayoutMinHeight: =44
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutJustifyContent: =LayoutJustifyContent.Start
                              LayoutGap: =8
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              DropShadow: =DropShadow.None
                            Children:
                              - txtChMensaje:
                                  Control: ModernTextInput
                                  Properties:
                                    Placeholder: ="Pregunta por un vuelo..."
                                    AccessibleLabel: ="Mensaje para el agente"
                                    Font: =Font.'Segoe UI'
                                    Size: =12.6
