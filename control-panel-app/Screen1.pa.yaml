            - tmrEstado:
                Control: Timer
                Properties:
                  Visible: =false
                  Duration: =5000
                  Repeat: =true
                  AutoStart: =true
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Start
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  OnTimerEnd: |-
                    =If(
                      Not(varCambiando),
                      IfError(
                        Set(varGw, GlobalDemoControl.GetState());
                        Set(varGwError, ""),
                        Set(varGwError, FirstError.Message)
                      );
                      IfError(ClearCollect(colRequests, GlobalDemoControl.GetRequests()), Blank())
                    )
            - tmrGuardrail:
                Control: Timer
                Properties:
                  Visible: =false
                  Duration: =30000
                  Repeat: =true
                  AutoStart: =true
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Start
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  OnTimerEnd: |-
                    =IfError(
                      Set(varGuardrail, GlobalDemoControl.GetGuardrail()),
                      Set(varGuardrail, Blank())
                    )
            - tmrAuditoria:
                Control: Timer
                Properties:
                  Visible: =false
                  Duration: =15000
                  Repeat: =true
                  Start: =varPestana = "audit"
                  AutoStart: =false
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Start
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  OnTimerEnd: |-
                    =IfError(
                      Set(varAuditResp, GlobalDemoControl.GetAudit({minutes: 60}));
                      Set(varAuditCfg, varAuditResp.configured);
                      ClearCollect(colAudit, varAuditResp.entries),
                      Blank()
                    )
